<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phone Shooter</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#menu{position:fixed;inset:0;background:#111e;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#fff;z-index:10}
#menu input,#menu button{font-size:18px;padding:12px;border-radius:10px;border:0;width:240px;text-align:center}
#menu button{background:#e53935;color:#fff;font-weight:700}
#hud{position:fixed;top:8px;left:8px;right:8px;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none;display:flex;justify-content:space-between;font-size:14px}
#hpbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:10px;background:#0006;border:1px solid #fff8;border-radius:5px;overflow:hidden}
#hp{height:100%;background:#4caf50;width:100%}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fffa;border-radius:50%;pointer-events:none}
#feed{position:fixed;top:40px;right:8px;color:#fff;font-size:13px;text-align:right;text-shadow:0 1px 3px #000;pointer-events:none}
#dead{position:fixed;inset:0;background:#a008;color:#fff;display:none;align-items:center;justify-content:center;font-size:32px;font-weight:800;pointer-events:none}
#stickBase{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#fff3;border:2px solid #fff6}
#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
.btn{position:fixed;border-radius:50%;background:#e53935cc;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff8}
#fire{right:24px;bottom:30px;width:84px;height:84px}
#scopeBtn{right:30px;bottom:130px;width:60px;height:60px;background:#8e24aacc;font-size:12px}
#crouchBtn{right:120px;bottom:100px;width:56px;height:56px;background:#2e7d32cc;font-size:11px}
#wsel{position:fixed;top:30px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:5}
.ws{background:#0008;color:#fff;border:1px solid #fff6;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:700}
.ws.on{background:#e53935;border-color:#fff}
#scope{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent var(--r,30vh),#000 calc(var(--r,30vh) + 1vh))}
#cross.dot{width:7px;height:7px;margin:-3px;background:#f22;border:0;box-shadow:0 0 10px 4px #f22b}
#cross.off{display:none}
#scope:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
#scope:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#000}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px #f00;opacity:0;transition:opacity .4s}
#hm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:26px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 0 4px #000}
#menu label{font-size:15px}
#gw{position:fixed;pointer-events:none}
#gw canvas{position:absolute;inset:0;width:100%;height:100%}
#mf{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#fff,#fd5 30%,#f804 60%,transparent 70%);transform:translate(-50%,-50%);opacity:0}
#jump{right:120px;bottom:30px;width:56px;height:56px;background:#1e88e5cc}

<div id="menu">

  <label><input type="checkbox" id="bots" style="width:auto"> 🤖 Practice vs bots (offline test)</label>
  <select id="botn" style="font-size:16px;padding:8px"><option>1</option><option selected>3</option><option>5</option><option>8</option></select>
  <label><input type="checkbox" id="shad" checked style="width:auto"> Shadows (turn off if laggy)</label>
  <button id="play">PLAY</button>
  <small>Left stick: walk (push to the edge = RUN)<br>Drag right side: aim · Red: shoot<br>CROUCH button · while running it becomes SLIDE</small>
</div>

 sp.scale.x+=((sl?2*(u.fl||1):1)-sp.scale.x)*.3;sp.scale.y+=((sl?1:2)-sp.scale.y)*.3;
 sp.position.y+=((sl?.5:1)+((pose==='w'||pose==='r')&&d>0?Math.abs(Math.sin(u.ph*3))*(pose==='r'?.08:.04):0)-sp.position.y)*.35;
 if(s!==u.ps){const hb=u.hb;if(s===4){hb[0].scale.y=.4;hb[0].position.y=.28;hb[1].position.y=.6}else if(s===3){hb[0].scale.y=.65;hb[0].position.y=.46;hb[1].position.y=1.15}else{hb[0].scale.y=1;hb[0].position.y=.7;hb[1].position.y=1.6}
  if(s===5)burst(feet,6,DUST,3,.5);else if(u.ps===5)burst(feet,10,DUST,4,.6);u.ps=s}
 if(s===1||s===2){u.fs+=d;if(u.fs>(s===2?1.6:2.4)){u.fs=0;burst(feet,2,DUST,1.3,.5)}}
 if(s===4&&Math.random()<.6){burst(feet,2,DUST,2.5,.5)}}
function tint(pid){const o=others.get(pid);if(o){const m=o.g.userData.spr.material;m.color.set(0xff5555);setTimeout(()=>m.color.set(0xffffff),90)}}
function deathFx(o){burst(new THREE.Vector3(o.g.position.x,1,o.g.position.z),30,0xff2a2a,5,.8)}
// ----- players
function mkPlayer(id,bot){const g=new THREE.Group(),hex=bot?0xb02a2a:new THREE.Color().setHSL((Math.abs(id)*0.37)%1,.7,.45).getHex(),tx=mkTx(hex);
 const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tx.w[0]}));spr.scale.set(1,2,1);spr.position.y=1;spr.raycast=()=>{};g.add(spr);
 const hb=(geo,y,head)=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({visible:false}));m.position.y=y;m.userData.pid=id;if(head)m.userData.head=true;g.add(m);return m};
 const hbb=hb(new THREE.BoxGeometry(.7,1.4,.5),.7),hbh=hb(new THREE.BoxGeometry(.4,.4,.4),1.6,1);
 const bl=new THREE.Mesh(new THREE.CircleGeometry(.5,12),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35,depthWrite:false}));bl.rotation.x=-Math.PI/2;bl.position.y=.02;bl.raycast=()=>{};g.add(bl);
 g.userData={spr,tx,ph:0,fr:"",s:0,ps:0,fs:0,hb:[hbb,hbh]};scene.add(g);return g}
function addOther(p){if(p.id===myId||others.has(p.id))return;const g=mkPlayer(p.id);g.position.set(p.x,p.y,p.z);others.set(p.id,{g,tx:p.x,ty:p.y,tz:p.z,try:p.ry,name:p.name,alive:p.hp>0});g.visible=p.hp>0;stats.set(p.id,{n:p.name,k:p.k||0,d:p.d||0})}
// ----- state / collision
const P={x:0,y:0,z:0,vy:0,vx:0,vz:0,hs:1,yaw:0,pitch:0},RAD=.45;
function collideP(o){for(const b of boxes){if(o.y>=b.h-.1)continue;const hx=b.w/2+RAD,hz=b.d/2+RAD,dx=o.x-b.x,dz=o.z-b.z;
 if(Math.abs(dx)<hx&&Math.abs(dz)<hz){const px=hx-Math.abs(dx),pz=hz-Math.abs(dz);if(px<pz)o.x+=px*Math.sign(dx||1);else o.z+=pz*Math.sign(dz||1)}}
 o.x=Math.max(-R+1.5,Math.min(R-1.5,o.x));o.z=Math.max(-R+1.5,Math.min(R-1.5,o.z))}
const spawnPt=()=>{const a=Math.random()*6.28;return{x:Math.cos(a)*24,z:Math.sin(a)*24}};
// ----- input
let mv={x:0,y:0},stickId=null,lookId=null,lastL={x:0,y:0},firing=false,wantJump=false;
const base=$('stickBase'),st=$('stick');
document.addEventListener('touchstart',e=>{for(const t of e.changedTouches){const tg=t.target;
 if(tg.closest('#stickBase')&&stickId===null){stickId=t.identifier;moveStick(t)}
 else if(tg.id==='fire')firing=true;
 else if(tg.id==='jump')wantJump=true;
 else if(tg.id==='scopeBtn')ads=!ads;
 else if(tg.id==='crouchBtn')crouchPress=true;
 else if(tg.classList.contains('ws'))setWeapon(+tg.dataset.i);
 else if(t.clientX>innerWidth*.35&&lookId===null&&!tg.closest('#menu')){lookId=t.identifier;lastL={x:t.clientX,y:t.clientY}}}
 if(!e.target.closest('#menu'))e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{for(const t of e.changedTouches){
 if(t.identifier===stickId)moveStick(t);
 else if(t.identifier===lookId){const k=.006*(cam.fov/75);P.yaw-=(t.clientX-lastL.x)*k;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(t.clientY-lastL.y)*k));lastL={x:t.clientX,y:t.clientY}}}
 e.preventDefault()},{passive:false});
function endT(e){for(const t of e.changedTouches){
 if(t.identifier===stickId){stickId=null;mv={x:0,y:0};st.style.left='40px';st.style.top='40px'}
 if(t.identifier===lookId)lookId=null}
 if(![...e.touches].some(t=>t.target.id==='fire'))firing=false}
document.addEventListener('touchend',endT);document.addEventListener('touchcancel',endT);
function moveStick(t){const r=base.getBoundingClientRect(),cx=r.left+60,cy=r.top+60;let dx=t.clientX-cx,dy=t.clientY-cy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}
 st.style.left=(40+dx)+'px';st.style.top=(40+dy)+'px';mv={x:dx/m,y:dy/m}}
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyC')crouchPress=true;if(e.code>='Digit1'&&e.code<='Digit5')setWeapon(+e.code.slice(5)-1);if(e.code==='KeyZ')ads=!ads});addEventListener('keyup',e=>keys[e.code]=0);
const touchDev='ontouchstart' in window;
addEventListener('mousedown',e=>{if(started&&e.target.tagName==='CANVAS'&&!touchDev)firing=true});addEventListener('mouseup',()=>{if(!touchDev)firing=false});
addEventListener('mousemove',e=>{if(document.pointerLockElement){const k=.003*(cam.fov/75);P.yaw-=e.movementX*k;P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*k))}});
document.addEventListener('click',e=>{if(started&&e.target.tagName==='CANVAS'&&!touchDev)e.target.requestPointerLock?.()});
// ----- effects
const fx=[];function addFx(o,ms){scene.add(o);fx.push({o,t:performance.now(),ms})}
function tracer(a,b){addFx(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0xffee88})),70)}
function spark(p,col){burst(p,col===0xff2222?12:7,col,col===0xff2222?4:3,.45)}
function hurtVis(){const h=$('hurt');h.style.transition='none';h.style.opacity=.9;requestAnimationFrame(()=>{h.style.transition='opacity .5s';h.style.opacity=0});navigator.vibrate?.(60)}
function hitMark(){$('hm').style.opacity=1;setTimeout(()=>$('hm').style.opacity=0,120)}
// ----- shooting
const ray=new THREE.Raycaster(),lr=new THREE.Raycaster();let lastShot=0;const V=new THREE.Vector3();
function shoot(){const w=W[cur],now=performance.now();if(now-lastShot<w.rate||dead)return;lastShot=now;
 const targets=[...solids];others.forEach(o=>o.alive&&targets.push(o.g));
 V.set(.22*(1-adsT),-.14+.08*adsT,-.9);cam.localToWorld(V);const muz=V.clone();let first=null;
 for(let i=0;i<w.pel;i++){const sp=w.spread*(ads?.4:1);ray.setFromCamera({x:(Math.random()-.5)*2*sp,y:(Math.random()-.5)*2*sp},cam);ray.far=130;
  const hit=ray.intersectObjects(targets,true)[0],end=hit?hit.point:ray.ray.at(120,new THREE.Vector3());if(!first)first=end;tracer(muz,end);
  if(hit){const pid=hit.object.userData.pid;spark(hit.point,pid?0xff2222:0xcccccc);
   if(pid){const dmg=w.dmg*(hit.object.userData.head?2:1);hitMark();tint(pid);
    if(pid<0)botHit(pid,dmg);else if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'hit',id:pid,dmg}))}}}
 showFlash();burst(muz,4,0xffcc55,2,.2);
 kick=1;rec+=(w.scope?.03:.006*(w.pel>1?3:1))*(cam.fov/75+.25);if(w.scope&&ads){ads=false;const wi=cur;setTimeout(()=>{if(cur===wi&&!running)ads=true},650)}
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'shoot',from:muz.toArray(),to:first.toArray()}))}
// ----- bots (offline practice)
function startPractice(n){practice=true;myId=0;stats.set(0,{n:$('name').value||'You',k:0,d:0});const s=spawnPt();P.x=s.x;P.z=s.z;
 for(let i=1;i<=n;i++){const id=-i,g=mkPlayer(id,true),q=spawnPt();g.position.set(q.x,0,q.z);others.set(id,{g,bot:true,hp:100,alive:true,name:'Bot'+i,next:0,sd:Math.random()<.5?1:-1});stats.set(id,{n:'Bot'+i,k:0,d:0})}refresh()}
function botHit(id,dmg){const o=others.get(id);if(!o||!o.alive)return;o.hp-=dmg;if(o.hp>0)return;o.alive=false;o.g.visible=false;deathFx(o);stats.get(0).k++;stats.get(id).d++;feed(`${stats.get(0).n} 💥 ${o.name}`);refresh();
 setTimeout(()=>{const s=spawnPt();o.g.position.set(s.x,0,s.z);o.hp=100;o.alive=true;o.g.visible=true},3000)}
function hurt(n,by){if(dead)return;hp-=n;$('hp').style.width=Math.max(0,hp)+'%';hurtVis();
 if(hp<=0){dead=true;$('dead').style.display='flex';stats.get(0).d++;if(by&&stats.get(by)){stats.get(by).k++;feed(`${stats.get(by).n} 💥 You`)}refresh();
  setTimeout(()=>{const s=spawnPt();P.x=s.x;P.z=s.z;P.y=0;hp=100;dead=false;$('hp').style.width='100%';$('dead').style.display='none'},3000)}}
function botsUpdate(dt,now){others.forEach((o,id)=>{if(!o.bot||!o.alive)return;const p=o.g.position,dx=P.x-p.x,dz=P.z-p.z,dist=Math.hypot(dx,dz)||1;
 o.g.rotation.y=Math.atan2(-dx,-dz);let vx=0,vz=0;if(dist>14){vx=dx/dist;vz=dz/dist}else if(dist<7){vx=-dx/dist;vz=-dz/dist}
 vx+=(-dz/dist)*o.sd*.8;vz+=(dx/dist)*o.sd*.8;if(Math.random()<.01)o.sd*=-1;if(now>(o.ct||0)){o.ct=now+2000+Math.random()*3000;o.cr=Math.random()<.3}const bs=(o.cr?.5:dist>14?1.8:1)*3.2,ox=p.x,oz=p.z;p.x+=vx*bs*dt;p.z+=vz*bs*dt;collideP(p);o.g.userData.s=o.cr?3:dist>14?2:1;animChar(o.g,Math.hypot(p.x-ox,p.z-oz),p.x-ox,p.z-oz);
 if(!dead&&now>o.next&&dist<45){o.next=now+700+Math.random()*700;const eye=new THREE.Vector3(p.x,1.6,p.z),tg=new THREE.Vector3(P.x,P.y+1.4,P.z),d=tg.clone().sub(eye),L=d.length();
  lr.set(eye,d.normalize());lr.far=L;if(!lr.intersectObjects(solids)[0]){tracer(eye,tg);burst(eye,4,0xffcc55,2,.2);if(Math.random()<.4*P.hs)hurt(10,id)}}})}
// ----- network
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:$('name').value||'Player',room:$('room').value.trim()||'main'}));
 ws.onclose=()=>{$('menu').style.display='flex';$('menu').querySelector('h1').textContent='Disconnected – reload';started=false};
 ws.onmessage=ev=>{const d=JSON.parse(ev.data);
  if(d.t==='init'){myId=d.me.id;P.x=d.me.x;P.z=d.me.z;stats.set(myId,{n:d.me.name,k:0,d:0});d.players.forEach(addOther);refresh()}
  else if(d.t==='new'){addOther(d.p);refresh()}
  else if(d.t==='pos'){const o=others.get(d.id);if(o){o.tx=d.x;o.ty=d.y;o.tz=d.z;o.try=d.ry;o.g.userData.s=d.s|0}}
  else if(d.t==='shoot'){tracer(new THREE.Vector3(...d.from),new THREE.Vector3(...d.to));burst(new THREE.Vector3(...d.from),4,0xffcc55,2,.2)}
  else if(d.t==='hp'){hp=d.hp;$('hp').style.width=hp+'%';hurtVis()}
  else if(d.t==='kill'){const k=stats.get(d.killer),v=stats.get(d.victim);if(k)k.k=d.k;if(v)v.d=d.d;feed(`${d.kn} 💥 ${d.vn}`);
   if(d.victim===myId){dead=true;hp=0;$('hp').style.width='0';$('dead').style.display='flex'}
   else{const o=others.get(d.victim);if(o){o.alive=false;o.g.visible=false;deathFx(o)}}refresh()}
  else if(d.t==='respawn'){if(d.id===myId){P.x=d.x;P.z=d.z;P.y=0;hp=100;dead=false;$('hp').style.width='100%';$('dead').style.display='none'}
   else{const o=others.get(d.id);if(o){o.alive=true;o.g.visible=true;o.g.position.set(d.x,0,d.z);o.tx=d.x;o.tz=d.z}}}
  else if(d.t==='left'){const o=others.get(d.id);if(o){scene.remove(o.g);others.delete(d.id);stats.delete(d.id);refresh()}}}}
function feed(t){const e=document.createElement('div');e.textContent=t;$('feed').prepend(e);setTimeout(()=>e.remove(),5000)}
function refresh(){const a=[...stats.entries()].sort((x,y)=>y[1].k-x[1].k).slice(0,6);
 $('board').innerHTML=a.map(([id,s])=>`${id===myId?'⭐':''}${s.n}: ${s.k}/${s.d}`).join('<br>');$('me').textContent=(practice?'PRACTICE · ':'Players: ')+stats.size}
// ----- loop
let last=performance.now(),netT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(started){
  if(!dead){let mx=mv.x,mz=mv.y;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;if(keys.KeyW)mz-=1;if(keys.KeyS)mz+=1;
   const l0=Math.hypot(mx,mz),l=Math.min(1,l0);if(l0>1){mx/=l0;mz/=l0}moving=l>.1;
   const c=Math.cos(P.yaw),sn=Math.sin(P.yaw),gnd=P.y<=.001,feet={x:P.x,y:.1,z:P.z};
   if(gnd)running=moving&&(l>.92||keys.ShiftLeft)&&!ads&&!crouching;if(running&&ads)ads=false;
   if(crouchPress){crouchPress=false;if(gnd&&!sliding){if(running&&slideCd<=0){sliding=true;slideT=.85;const dx=mx*c+mz*sn,dz=-mx*sn+mz*c,m=Math.hypot(dx,dz)||1;slideDir=[dx/m,dz/m];crouching=false;burst(feet,10,DUST,3,.5)}else crouching=!crouching}}
   if((wantJump||keys.Space)&&gnd){if(sliding){sliding=false;slideCd=.3}crouching=false;P.vy=7.2;burst(feet,8,DUST,3,.5)}wantJump=false;
   if(sliding){slideT-=dt;const k=Math.max(0,slideT/.85),sp=3.5+8*k*k;P.vx=slideDir[0]*sp;P.vz=slideDir[1]*sp;if(slideT<=0){sliding=false;slideCd=.5;crouching=true}}
   else{let sp=crouching?2.6:running?8.5:4.8;if(ads)sp=Math.min(sp,3);sp*=Math.max(.4,l);const a=Math.min(1,dt*(gnd?14:3));P.vx+=((mx*c+mz*sn)*sp-P.vx)*a;P.vz+=((-mx*sn+mz*c)*sp-P.vz)*a}
   P.x+=P.vx*dt;P.z+=P.vz*dt;slideCd-=dt;
   const vy0=P.vy;P.vy-=20*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0){if(!gnd&&vy0<-3){landDip=Math.min(.3,-vy0*.03);burst(feet,12,DUST,4,.6)}P.vy=0}
   collideP(P);P.hs=sliding?.45:crouching?.65:1;eye+=((sliding?.7:crouching?1.05:1.6)-eye)*Math.min(1,dt*12);landDip*=Math.max(0,1-dt*8);
   myState=P.y>.01?5:sliding?4:crouching?3:moving?(running?2:1):0;
   if(gnd&&moving&&!sliding){stepT-=dt;if(stepT<0){stepT=crouching?.5:running?.17:.32;burst(feet,running?3:2,DUST,running?2:1.1,.5)}}
   if(sliding){burst({x:P.x-slideDir[0]*.3,y:.1,z:P.z-slideDir[1]*.3},3,DUST,2.5,.5);if(Math.random()<.5)burst(feet,1,0xffd070,3,.3)}
   const lb=running&&gnd?'SLIDE':crouching?'STAND':'CROUCH';if(lb!==cbl){cbl=lb;$('crouchBtn').textContent=lb}
   if(firing)shoot()}else{sliding=crouching=running=moving=false;myState=0}
  const w=W[cur],tf=ads?75/w.zoom:75+(running?7:0)+(sliding?6:0);cam.fov+=(tf-cam.fov)*.3;cam.updateProjectionMatrix();
  const ov=!!(ads&&w.ov&&adsT>.7);$('scope').style.display=ov?'block':'none';$('scope').style.setProperty('--r',(w.ov||30)+'vh');$('cross').className=ov||(ads&&!w.dot)?'off':(ads?'dot':'');gw.style.visibility=ov?'hidden':'visible';
  kick=Math.max(0,kick-dt*6);adsT+=((ads?1:0)-adsT)*.25;{const s=gS,bx=moving&&!ads?Math.sin(now*.009)*5*s:0,by=moving&&!ads?Math.abs(Math.sin(now*.009))*5*s:0;gw.style.transform=`translate(${-adsT*W[cur].ax*s+bx}px,${by-adsT*W[cur].ay*s+kick*8*s+runT*16*s}px) scale(${1+kick*.07}) rotate(${-kick*1.5-runT*5}deg)`}
  roll+=((sliding?-.09:0)-roll)*Math.min(1,dt*8);runT+=((running||sliding?1:0)-runT)*Math.min(1,dt*8);rec*=Math.max(0,1-dt*9);const bob=P.y<.01?(running?Math.sin(now*.016)*.05:moving?Math.sin(now*.01)*.02:0):0;cam.position.set(P.x,P.y+eye-landDip+bob,P.z);cam.rotation.set(P.pitch+rec,P.yaw,roll);$('scope').style.transform=`translateY(${rec*900}px)`;
  netT+=dt;if(netT>.05&&ws&&ws.readyState===1){netT=0;ws.send(JSON.stringify({t:'pos',x:P.x,y:P.y,z:P.z,ry:P.yaw,s:myState}))}
  if(practice)botsUpdate(dt,now);
  others.forEach(o=>{if(o.bot)return;const ox=o.g.position.x,oz=o.g.position.z;o.g.position.x+=(o.tx-ox)*.25;o.g.position.y+=(o.ty-o.g.position.y)*.25;o.g.position.z+=(o.tz-oz)*.25;o.g.rotation.y=o.try;animChar(o.g,Math.hypot(o.g.position.x-ox,o.g.position.z-oz),o.g.position.x-ox,o.g.position.z-oz)})}
 partUpdate(dt);for(let i=fx.length-1;i>=0;i--)if(now-fx[i].t>fx[i].ms){scene.remove(fx[i].o);fx.splice(i,1)}
 ren.render(scene,cam)}
requestAnimationFrame(loop);
$('play').onclick=()=>{localStorage.setItem('n',$('name').value);
 const on=$('shad').checked;ren.shadowMap.enabled=on;sun.castShadow=on;
 $('menu').style.display='none';started=true;
 if($('bots').checked)startPractice(+$('botn').value);else connect();
 document.documentElement.requestFullscreen?.().catch(()=>{});screen.orientation?.lock?.('landscape').catch(()=>{})};
